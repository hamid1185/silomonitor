<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Silo Monitor Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen', 'Ubuntu', 'Cantarell', sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 0;
    }
    
    .topbar {
      background: #1e293b;
      border-bottom: 1px solid #334155;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    
    .topbar-left h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: #f1f5f9;
    }
    
    .topbar-right {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 0.875rem;
      color: #94a3b8;
    }
    
    .container {
      max-width: 1800px;
      margin: 0 auto;
      padding: 24px;
    }
    
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    
    .kpi-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    
    .kpi-label {
      font-size: 0.75rem;
      font-weight: 600;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .kpi-value {
      font-size: 1.75rem;
      font-weight: 700;
      color: #f1f5f9;
    }
    
    .kpi-secondary {
      font-size: 0.875rem;
      color: #64748b;
    }
    
    .status-online { color: #10b981; }
    .status-offline { color: #ef4444; }
    .status-warning { color: #f59e0b; }
    
    /* New nodes grid - display individual node cards with graphs */
    .nodes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(520px, 1fr));
      gap: 20px;
      margin-bottom: 24px;
    }
    
    .node-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 20px;
      transition: border-color 0.2s;
    }
    
    .node-card:hover {
      border-color: #475569;
    }
    
    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid #334155;
    }
    
    .node-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f1f5f9;
    }
    
    .node-status {
      padding: 4px 12px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      background: #334155;
      color: #cbd5e1;
    }
    
    .node-status.online { background: #10b98133; color: #10b981; }
    .node-status.recent { background: #f59e0b33; color: #f59e0b; }
    .node-status.disconnected { background: #ef444433; color: #ef4444; }
    
    .node-metrics {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }
    
    .metric {
      background: #0f172a;
      padding: 12px;
      border-radius: 4px;
      border-left: 3px solid #0ea5e9;
    }
    
    .metric-value {
      font-size: 1.15rem;
      font-weight: 600;
      color: #f1f5f9;
    }
    
    .metric-label {
      font-size: 0.7rem;
      color: #94a3b8;
      margin-top: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    
    .metric-temp { border-left-color: #ef4444; }
    .metric-humid { border-left-color: #3b82f6; }
    .metric-mq { border-left-color: #8b5cf6; }
    .metric-uptime { border-left-color: #10b981; }
    
    .risk-section {
      margin: 16px 0;
      padding: 12px;
      background: #0f172a;
      border-radius: 4px;
    }
    
    .risk-label {
      font-size: 0.85rem;
      color: #cbd5e1;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .risk-value {
      font-weight: 600;
      color: #f1f5f9;
    }
    
    .risk-indicator {
      width: 100%;
      height: 6px;
      background: #334155;
      border-radius: 3px;
      overflow: hidden;
    }
    
    .risk-bar {
      height: 100%;
      background: #10b981;
      transition: width 0.3s, background-color 0.3s;
    }
    
    .risk-bar.high { background: #ef4444; }
    .risk-bar.medium { background: #f59e0b; }
    .risk-bar.low { background: #10b981; }
    
    .health-info {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 12px;
    }
    
    .health-badge {
      padding: 8px;
      border-radius: 4px;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 600;
    }
    
    .health-good { background: #10b98133; color: #10b981; }
    .health-warning { background: #f59e0b33; color: #f59e0b; }
    .health-critical { background: #ef444433; color: #ef4444; }
    
    /* Individual chart container for each node */
    .node-chart {
      position: relative;
      height: 240px;
      width: 100%;
      margin-top: 16px;
      border-top: 1px solid #334155;
      padding-top: 12px;
    }
    
    .chart-empty {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 240px;
      background: #0f172a;
      border-radius: 4px;
      border: 2px dashed #334155;
      color: #64748b;
      font-size: 0.9rem;
    }
    
    .timestamp {
      position: fixed;
      bottom: 16px;
      right: 24px;
      font-size: 0.75rem;
      color: #64748b;
    }
    
    @media (max-width: 1200px) {
      .nodes-grid {
        grid-template-columns: 1fr;
      }
    }
    
    @media (max-width: 640px) {
      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      
      .node-metrics {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-left">
      <h1>🌾 Silo Monitor</h1>
    </div>
    <div class="topbar-right">
      <span>Last updated: <span id="lastUpdated">-</span></span>
    </div>
  </div>

  <div class="container">
    <!-- KPI Cards -->
    <div class="kpi-grid" id="kpiGrid">
      <div class="kpi-card">
        <div class="kpi-label">Active Devices</div>
        <div class="kpi-value"><span id="activeDevicesKpi" class="status-online">0</span></div>
        <div class="kpi-secondary" id="activeDevicesDetail">-</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Total Readings</div>
        <div class="kpi-value" id="totalReadingsKpi">0</div>
        <div class="kpi-secondary">All time</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Critical Alerts</div>
        <div class="kpi-value"><span id="criticalAlertsKpi" class="status-offline">0</span></div>
        <div class="kpi-secondary" id="criticalDetail">No critical alerts</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Avg Health Status</div>
        <div class="kpi-value" id="avgHealthKpi">-</div>
        <div class="kpi-secondary">Across all devices</div>
      </div>
    </div>

    <!-- Connected Devices / Sensor Nodes Grid -->
    <div style="margin-bottom: 24px;">
      <div style="margin-bottom: 16px;">
        <h2 style="font-size: 1.2rem; font-weight: 600; color: #f1f5f9;">Connected Sensors</h2>
        <p style="font-size: 0.875rem; color: #94a3b8; margin-top: 4px;">Real-time device metrics and sensor data</p>
      </div>
      <div class="nodes-grid" id="nodesGrid">
        <div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748b;">Loading devices...</div>
      </div>
    </div>
  </div>

  <div class="timestamp">Updated at <span id="timestamp">-</span></div>

  <script>
    let charts = {};
    let devicesData = {};
    let latestReadings = {};
    
    async function initDashboard() {
      await loadData();
      
      setInterval(loadData, 5000);
      setInterval(updateTimestamp, 1000);
      
      updateTimestamp();
    }
    
    async function loadData() {
      await Promise.all([
        loadStats(),
        loadDevices(),
        loadLatestReadings()
      ]);
      
      await renderNodeCards();
    }
    
    async function loadStats() {
      try {
        const response = await fetch('/api/stats');
        const stats = await response.json();
        
        document.getElementById('totalReadingsKpi').textContent = 
          (stats.totalReadings?.count || 0).toLocaleString();
        
        const activeCount = stats.activeDevices?.count || 0;
        document.getElementById('activeDevicesKpi').textContent = activeCount;
        document.getElementById('activeDevicesDetail').textContent = 
          `${activeCount} device${activeCount !== 1 ? 's' : ''} online`;
        
        updateCriticalAlerts();
      } catch (error) {
        console.error('Error loading stats:', error);
      }
    }
    
    async function loadDevices() {
      try {
        const response = await fetch('/api/devices');
        const devices = await response.json();
        
        devicesData = devices;
        
      } catch (error) {
        console.error('Error loading devices:', error);
      }
    }
    
    async function loadLatestReadings() {
      try {
        const response = await fetch('/api/latest');
        const readings = await response.json();
        
        latestReadings = {};
        readings.forEach(reading => {
          latestReadings[reading.deviceId] = reading;
        });
        
        updateCriticalAlerts();
        updateAvgHealth(readings);
      } catch (error) {
        console.error('Error loading latest readings:', error);
      }
    }
    
    function calculateUptime(firstSeen, lastSeen) {
      const first = new Date(firstSeen);
      const last = new Date(lastSeen);
      const hours = Math.floor((last - first) / (1000 * 60 * 60));
      const days = Math.floor(hours / 24);
      
      if (days > 0) return `${days}d ${hours % 24}h`;
      return `${hours}h`;
    }
    
    async function renderNodeCards() {
      const grid = document.getElementById('nodesGrid');
      
      if (devicesData.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748b;">No devices</div>';
        return;
      }
      
      grid.innerHTML = devicesData.map(device => {
        const reading = latestReadings[device.deviceId];
        const uptime = calculateUptime(device.firstSeen, device.lastSeen);
        const risk = reading?.spoilageRisk || 0;
        const health = reading?.grainHealth || 'UNKNOWN';
        
        const riskClass = risk > 70 ? 'high' : risk > 40 ? 'medium' : 'low';
        const healthClass = health === 'GOOD' ? 'good' : health === 'WARNING' ? 'warning' : 'critical';
        const statusClass = device.status === 'online' ? 'online' : device.status === 'recent' ? 'recent' : 'disconnected';
        
        return `
          <div class="node-card" ${device.status === 'offline' ? 'style="opacity: 0.6; border-color: #475569;"' : ''}>
            <div class="node-header">
              <div class="node-title">${device.deviceId}</div>
              <div class="node-status ${statusClass}">${device.status.toUpperCase()}</div>
            </div>
            
            ${reading ? `
              <div class="node-metrics">
                <div class="metric metric-temp">
                  <div class="metric-value">${reading.temperature?.toFixed(1)}°C</div>
                  <div class="metric-label">Temperature</div>
                </div>
                <div class="metric metric-humid">
                  <div class="metric-value">${reading.humidity?.toFixed(1)}%</div>
                  <div class="metric-label">Humidity</div>
                </div>
                <div class="metric metric-mq">
                  <div class="metric-value">${reading.mq_value?.toFixed(0)}</div>
                  <div class="metric-label">MQ Sensor</div>
                </div>
                <div class="metric metric-uptime">
                  <div class="metric-value">${uptime}</div>
                  <div class="metric-label">Uptime</div>
                </div>
              </div>
              
              <div class="risk-section">
                <div class="risk-label">
                  <span>Spoilage Risk</span>
                  <span class="risk-value">${risk.toFixed(1)}%</span>
                </div>
                <div class="risk-indicator">
                  <div class="risk-bar ${riskClass}" style="width: ${Math.min(risk, 100)}%"></div>
                </div>
              </div>
              
              <div class="health-info">
                <div class="health-badge health-${healthClass}">
                  Health: ${health}
                </div>
                <div class="health-badge" style="background: #334155; color: #cbd5e1;">
                  Readings: ${device.readingCount}
                </div>
              </div>
            ` : `
              <div style="padding: 20px; text-align: center; color: #64748b;">No recent data</div>
            `}
            
            <div class="node-chart" id="chart-${device.deviceId}">
              <div class="chart-empty">No data available</div>
            </div>
          </div>
        `;
      }).join('');
      
      for (const device of devicesData) {
        await loadDeviceChart(device.deviceId);
      }
    }
    
    async function loadDeviceChart(deviceId) {
      try {
        const response = await fetch(`/api/history/${deviceId}?limit=50&hours=24`);
        const rows = await response.json();
        
        const chartDiv = document.getElementById(`chart-${deviceId}`);
        
        if (rows.length === 0) {
          // Keep empty state
          return;
        }
        
        const labels = rows.map(r => new Date(r.ts_server).toLocaleTimeString());
        const temps = rows.map(r => r.temperature);
        const hums = rows.map(r => r.humidity);
        const mqs = rows.map(r => r.mq_value);
        
        chartDiv.innerHTML = '<canvas></canvas>';
        const ctx = chartDiv.querySelector('canvas').getContext('2d');
        
        if (charts[deviceId]) {
          charts[deviceId].destroy();
        }
        
        charts[deviceId] = new Chart(ctx, {
          type: 'line',
          data: {
            labels,
            datasets: [
              {
                label: 'Temp °C',
                data: temps,
                borderColor: '#ef4444',
                backgroundColor: 'rgba(239, 68, 68, 0.05)',
                fill: true,
                tension: 0.3,
                borderWidth: 2,
                pointRadius: 0,
                pointHoverRadius: 6
              },
              {
                label: 'Humidity %',
                data: hums,
                borderColor: '#3b82f6',
                backgroundColor: 'rgba(59, 130, 246, 0.05)',
                fill: true,
                tension: 0.3,
                borderWidth: 2,
                yAxisID: 'y1',
                pointRadius: 0,
                pointHoverRadius: 6
              },
              {
                label: 'MQ Sensor',
                data: mqs,
                borderColor: '#8b5cf6',
                backgroundColor: 'rgba(139, 92, 246, 0.05)',
                fill: true,
                tension: 0.3,
                borderWidth: 2,
                yAxisID: 'y2',
                pointRadius: 0,
                pointHoverRadius: 6
              }
            ]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { mode: 'index', intersect: false },
            plugins: {
              legend: {
                display: true,
                labels: { color: '#94a3b8', font: { size: 11 }, usePointStyle: true }
              }
            },
            scales: {
              x: {
                display: true,
                grid: { color: '#334155', drawBorder: false },
                ticks: { color: '#94a3b8', maxRotation: 0, font: { size: 10 } }
              },
              y: {
                type: 'linear',
                display: true,
                position: 'left',
                grid: { color: '#334155', drawBorder: false },
                ticks: { color: '#94a3b8', font: { size: 10 } }
              },
              y1: {
                type: 'linear',
                display: true,
                position: 'right',
                grid: { drawOnChartArea: false, drawBorder: false },
                ticks: { color: '#94a3b8', font: { size: 10 } }
              },
              y2: {
                type: 'linear',
                display: false,
                position: 'right',
                grid: { drawOnChartArea: false, drawBorder: false },
                ticks: { color: '#8b5cf6', font: { size: 10 } }
              }
            }
          }
        });
        
      } catch (error) {
        console.error(`Error loading chart for ${deviceId}:`, error);
      }
    }
    
    function updateCriticalAlerts() {
      const readings = Object.values(latestReadings);
      const critical = readings.filter(r => (r.spoilageRisk || 0) > 70).length;
      
      const kpi = document.getElementById('criticalAlertsKpi');
      const detail = document.getElementById('criticalDetail');
      
      kpi.textContent = critical;
      detail.textContent = critical > 0 ? `${critical} device${critical !== 1 ? 's' : ''} critical` : 'All systems normal';
    }
    
    function updateAvgHealth(readings) {
      if (readings.length === 0) return;
      
      const avgRisk = readings.reduce((sum, r) => sum + (r.spoilageRisk || 0), 0) / readings.length || 0;
      const status = avgRisk > 70 ? 'Critical' : avgRisk > 40 ? 'Warning' : 'Good';
      
      document.getElementById('avgHealthKpi').textContent = status;
    }
    
    function updateTimestamp() {
      const now = new Date();
      document.getElementById('lastUpdated').textContent = now.toLocaleTimeString();
      document.getElementById('timestamp').textContent = now.toLocaleString();
    }
    
    document.addEventListener('DOMContentLoaded', initDashboard);
  </script>
</body>
</html>
